<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3650" />
      <stop offset="70%" stop-color="#0e1a28" />
      <stop offset="100%" stop-color="#070d15" />
    </radialGradient>

    <!-- Hat Red Gradient -->
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Face Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>

    <!-- Beard White Soft Gradient -->
    <linearGradient id="beardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.8" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="#ffffff" stroke-dasharray="6 10" stroke-width="3" opacity="0.25" />

  <!-- Santa Icon Group -->
  <g filter="url(#shadow)">
    <!-- Fluffy Beard Back Base -->
    <path d="M 130,240 C 120,380 200,440 256,440 C 312,440 392,380 382,240 C 350,250 310,240 256,250 C 202,240 162,250 130,240 Z" fill="url(#beardGrad)" />

    <!-- Face Base -->
    <ellipse cx="256" cy="230" rx="95" ry="85" fill="url(#skinGrad)" />

    <!-- Rosy Cheeks -->
    <ellipse cx="205" cy="245" rx="22" ry="14" fill="#f87171" opacity="0.45" />
    <ellipse cx="307" cy="245" rx="22" ry="14" fill="#f87171" opacity="0.45" />

    <!-- Eyes (Happy Arcs) -->
    <path d="M 195,215 Q 210,200 225,215" stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 287,215 Q 302,200 317,215" stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Eyebrows (White Fluffy) -->
    <path d="M 185,198 Q 210,186 230,198" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 282,198 Q 302,186 327,198" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Jolly Button Nose -->
    <ellipse cx="256" cy="232" rx="18" ry="14" fill="#ef4444" />
    <ellipse cx="252" cy="228" rx="6" ry="4" fill="#fca5a5" opacity="0.8" />

    <!-- Big Soft White Mustache -->
    <path d="M 256,242 C 220,232 165,255 145,280 C 175,295 220,285 256,260 C 292,285 337,295 367,280 C 347,255 292,232 256,242 Z" fill="#ffffff" filter="url(#shadow)" />

    <!-- Smile Line under Mustache -->
    <path d="M 235,295 Q 256,312 277,295" stroke="#dc2626" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Santa Hat Body -->
    <path d="M 150,175 C 150,175 220,80 320,80 C 380,80 395,120 380,165 C 370,190 325,180 325,180 C 270,175 150,175 150,175 Z" fill="url(#hatGrad)" />

    <!-- Drooping Hat Tail to Right side -->
    <path d="M 330,120 C 370,130 410,180 395,230 Q 390,245 375,245 C 365,245 360,230 365,210 C 375,175 350,140 330,120 Z" fill="url(#hatGrad)" />

    <!-- Fluffy Hat Trim (Bottom band) -->
    <path d="M 135,175 C 175,160 337,160 377,175 C 390,192 377,208 362,202 C 322,188 190,188 150,202 C 135,208 122,192 135,175 Z" fill="#ffffff" />
    <circle cx="145" cy="188" r="16" fill="#ffffff" />
    <circle cx="180" cy="182" r="17" fill="#ffffff" />
    <circle cx="218" cy="180" r="18" fill="#ffffff" />
    <circle cx="256" cy="180" r="18" fill="#ffffff" />
    <circle cx="294" cy="180" r="18" fill="#ffffff" />
    <circle cx="332" cy="182" r="17" fill="#ffffff" />
    <circle cx="367" cy="188" r="16" fill="#ffffff" />

    <!-- Soft Pom-Pom at Hat Tip -->
    <circle cx="380" cy="248" r="26" fill="#ffffff" filter="url(#shadow)" />
    <circle cx="375" cy="242" r="10" fill="#f8fafc" />
  </g>

  <!-- Sparkles & Stardust Accents -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <path d="M 90,110 L 95,125 L 110,130 L 95,135 L 90,150 L 85,135 L 70,130 L 85,125 Z" opacity="0.9" />
    <path d="M 420,100 L 424,112 L 436,116 L 424,120 L 420,132 L 416,120 L 404,116 L 416,112 Z" opacity="0.85" />
    <path d="M 100,380 L 103,390 L 113,393 L 103,396 L 100,406 L 97,396 L 87,393 L 97,390 Z" opacity="0.8" />
    <path d="M 410,360 L 413,370 L 423,373 L 413,376 L 410,386 L 407,376 L 397,373 L 407,370 Z" opacity="0.85" />
  </g>
</svg>
